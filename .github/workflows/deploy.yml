name: Deploy to GitHub Pages

# Disabled on push: GitHub Actions is currently locked on this account for
# billing reasons, so every push produced a failed run. Publish with
# `npm run deploy` (gh-pages branch) in the meantime. To restore automatic
# deploys once Actions works again, uncomment the push trigger below and set
# Settings -> Pages -> Source to "GitHub Actions".
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish before the next starts; never cancel a live run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Stop GitHub Pages from running Jekyll, which would drop the _next folder.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
